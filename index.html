<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Словозмей</title>
<meta name="theme-color" content="#0a1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Словозмей">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=102"><script>(function(){var k="hubFrom",q=/[?&]from=hub(&|$)/.test(location.search);try{if(q)sessionStorage.setItem(k,"1")}catch(e){}var f=q;try{f=f||sessionStorage.getItem(k)==="1"}catch(e){}var s=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone;if(f&&!s)document.documentElement.setAttribute("data-hub","1")})();</script>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="hs"><small id="tScore">ОЧКИ</small><b id="score">0</b></div>
    <div id="word" aria-live="polite"></div>
    <div class="hs r"><small id="tLives">ЖИЗНИ</small><b id="lives">♥♥♥</b></div>
  </header>
  <main id="stage"><canvas id="cv"></canvas></main>
  <button id="pause" hidden aria-label="Пауза">❚❚</button>

  <section id="menu" class="panel">
    <a id="hubB" href="https://felykxzy.github.io/" aria-label="Вернуться в хаб игр">‹ Игры</a>
    <div class="logo" aria-label="Словозмей"><span>СЛОВО</span><span>ЗМЕЙ</span></div>
    <p id="tag">Ешь буквы по порядку и собирай слова</p>
    <button id="play" class="big">ИГРАТЬ</button>
    <div id="langs" role="group" aria-label="Язык"><button data-l="ru">РУС</button><button data-l="uk">УКР</button><button data-l="en">ENG</button></div>
    <p id="best" class="muted"></p>
    <button id="howB" class="link">Как играть</button>
  </section>

  <section id="how" class="panel" hidden>
    <h2 id="howT">Как играть</h2>
    <ol id="howL"></ol>
    <button id="howOk" class="big">ПОНЯТНО</button>
  </section>

  <section id="over" class="panel" hidden>
    <h2 id="overT">КОНЕЦ ИГРЫ</h2>
    <div class="res"><b id="oScore">0</b><small id="oWords"></small></div>
    <p id="oBest" class="muted"></p>
    <button id="again" class="big">ЕЩЁ РАЗ</button>
    <button id="toMenu" class="link">В меню</button>
  </section>

  <section id="paused" class="panel" hidden>
    <h2 id="pauseT">ПАУЗА</h2>
    <button id="resume" class="big">ПРОДОЛЖИТЬ</button>
    <button id="quit" class="link">В меню</button>
  </section>
</div>
<script src="core.js?v=102"></script>
<script src="app.js?v=102"></script>
</body>
</html>
